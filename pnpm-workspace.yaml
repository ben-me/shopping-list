packages:
  - 'apps/*'
  - 'packages/*'

storeDir: .pnpm-store

catalog:
  '@types/node': ^24.13.3
  better-auth: ^1.7.1
  oxfmt: ^0.64.0
  oxlint: ^1.74.0
  typescript: ^6.0.0
  vitest: ^4.1.11

allowBuilds:
  esbuild: true
  sharp: true
  workerd: true

minimumReleaseAgeExclude:
  - hono@4.13.5

onlyBuiltDependencies:
  - esbuild
  - workerd
